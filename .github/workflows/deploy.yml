name: Deploy AI Code Reviewer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            cd ~/AI-code-Reviewer

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing backend dependencies..."
            cd server
            npm ci

            echo "Restarting backend..."
            pm2 restart ai-code-reviewer --update-env

            echo "Building frontend..."
            cd ..
            npm ci
            npm run build

            echo "Updating Nginx frontend..."
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r client/dist/* /usr/share/nginx/html/

            echo "Reloading Nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment completed!"

            echo "Checking backend..."
            sleep 5
            curl -f http://127.0.0.1:5001/api/auth/github -I