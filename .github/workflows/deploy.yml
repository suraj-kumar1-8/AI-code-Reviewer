name: Deploy AI Code Reviewer

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy to Production
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_DIR="$HOME/AI-code-Reviewer"
          FRONTEND_DIR="/usr/share/nginx/html"
          BACKUP_DIR="/tmp/ai-code-reviewer-frontend-backup"

          cd "$APP_DIR"

          echo "======================================"
          echo "🚀 AI Code Reviewer Production Deploy"
          echo "======================================"

          echo "Current production commit:"
          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "$PREVIOUS_COMMIT"

          echo "Fetching latest main..."
          git fetch origin main

          NEW_COMMIT=$(git rev-parse origin/main)
          echo "New commit: $NEW_COMMIT"

          if [ "$PREVIOUS_COMMIT" = "$NEW_COMMIT" ]; then
            echo "No new commit. Nothing to deploy."
            exit 0
          fi

          echo "Updating source..."
          git reset --hard origin/main

          echo "Node version:"
          node -v

          echo "npm version:"
          npm -v

          echo "Installing frontend dependencies..."
          npm ci

          echo "Building frontend..."
          npm run build

          echo "Installing backend dependencies..."
          cd server
          npm ci
          cd ..

          echo "Frontend + backend build successful."

          echo "Creating frontend backup..."
          sudo rm -rf "$BACKUP_DIR"
          sudo cp -a "$FRONTEND_DIR" "$BACKUP_DIR"

          echo "Restarting backend..."
          cd server
          pm2 restart ai-code-reviewer --update-env
          cd ..

          echo "Waiting for backend..."
          sleep 5

          echo "Checking backend health..."
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            http://127.0.0.1:5001/api/auth/github || true)

          echo "Backend HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "302" ]; then
            echo "❌ Backend health check failed."
            echo "🔄 Rolling back backend..."

            git reset --hard "$PREVIOUS_COMMIT"

            cd server
            npm ci
            pm2 restart ai-code-reviewer --update-env
            cd ..

            echo "❌ Deployment rolled back."
            exit 1
          fi

          echo "✅ Backend healthy."

          echo "Deploying frontend..."
          sudo rm -rf "$FRONTEND_DIR"/*
          sudo cp -a client/dist/. "$FRONTEND_DIR"/

          echo "Testing Nginx..."
          if ! sudo nginx -t; then
            echo "❌ Nginx configuration failed."
            echo "🔄 Restoring frontend..."

            sudo rm -rf "$FRONTEND_DIR"/*
            sudo cp -a "$BACKUP_DIR"/. "$FRONTEND_DIR"/

            git reset --hard "$PREVIOUS_COMMIT"

            cd server
            npm ci
            pm2 restart ai-code-reviewer --update-env
            cd ..

            exit 1
          fi

          echo "Reloading Nginx..."
          sudo systemctl reload nginx

          echo "======================================"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Previous: $PREVIOUS_COMMIT"
          echo "Current:  $NEW_COMMIT"
